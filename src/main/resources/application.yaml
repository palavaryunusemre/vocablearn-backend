spring:
  application:
    name: vocab-learn
  datasource:
    url: jdbc:postgresql://localhost:5433/vocablearn
    username: vocablearn
    password: vocablearn
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    # Groq, via its OpenAI-API-compatible endpoint. No RAG/vector-store/
    # Ollama/embedding config -- the chatbot answers directly from the
    # model's own knowledge (plus whatever quiz-question context the
    # frontend sends inline), no retrieval step involved.
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: openai/gpt-oss-120b

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-min-32-bytes-long}
    expiration-minutes: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
