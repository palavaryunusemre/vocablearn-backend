spring:
  datasource:
    url: jdbc:h2:mem:vocablearn;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-jwt-signing-min-32-bytes-long
    expiration-minutes: 60
