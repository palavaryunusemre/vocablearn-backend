services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vocablearn-postgres
    environment:
      POSTGRES_DB: vocablearn
      POSTGRES_USER: vocablearn
      POSTGRES_PASSWORD: vocablearn
    ports:
      - "5433:5432"
    volumes:
      - vocablearn-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocablearn -d vocablearn"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocablearn-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vocablearn
      SPRING_DATASOURCE_USERNAME: vocablearn
      SPRING_DATASOURCE_PASSWORD: vocablearn
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-min-32-bytes-long}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: vocablearn-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  vocablearn-data:
